<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NETVILA 5 – Failai 2.0</title>
<style>
:root{--bg:#102017;--panel:#e9f0b7;--ink:#17231a;--dark:#0b130e;--mid:#294b32;--gold:#ffd84d;--good:#7fc46b;--bad:#ef826e;--paper:#f7f4cf}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Courier New",monospace;background:radial-gradient(circle at top,#29462f 0,#102017 45%,#09100c 100%);color:#eef5d0}
body{display:flex;justify-content:center}.wrap{width:min(1000px,100%);padding:12px}.shell{background:#1d3424;border:4px solid #070d09;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.top{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:#101e15;padding:12px;border-bottom:4px solid #070d09}.brand{font-weight:900;letter-spacing:.7px}.chip{background:#31523a;border:2px solid #070d09;border-radius:7px;padding:7px 10px;font-weight:900;white-space:nowrap}
.screen{padding:18px;min-height:610px;background:linear-gradient(#173020,#102019)}.card{background:var(--panel);color:var(--ink);border:4px solid #101a13;border-radius:8px;box-shadow:8px 8px 0 rgba(0,0,0,.26);padding:18px;max-width:800px;margin:0 auto 16px}.card h1,.card h2{margin:0 0 10px}.muted{color:#52604e}.mission{display:inline-block;background:#26452e;color:#f3f8d3;padding:5px 8px;border:2px solid #101a13;margin-bottom:10px;font-weight:900}.btn{border:3px solid #101a13;background:#dce7a3;color:#17231a;padding:11px 14px;border-radius:5px;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #101a13}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #101a13}.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}.btn.alt{background:#9bc184}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.choices{display:grid;gap:10px;margin-top:14px}.choice{text-align:left;width:100%}.choice.correct{background:var(--good)}.choice.wrong{background:var(--bad)}
.filebox{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}.file{background:var(--paper);border:3px solid #152219;border-radius:7px;padding:14px;text-align:center;font-weight:900;cursor:pointer;min-height:104px;display:flex;flex-direction:column;justify-content:center;gap:6px}.file.selected{outline:5px solid var(--gold);transform:translateY(-2px)}.icon{font-size:34px}.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}.folder{background:#d7c46a;border:3px solid #152219;border-radius:6px;padding:12px;text-align:center;font-weight:900;cursor:pointer}.folder:hover{filter:brightness(1.06)}
.sizegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.sizecard{background:var(--paper);border:3px solid #152219;border-radius:7px;padding:18px 8px;text-align:center;font-weight:900;cursor:pointer}.sizecard.used{opacity:.35;pointer-events:none}.order{padding:10px;margin-top:12px;border:2px dashed #607255;background:#f6f0c8;min-height:46px}
.progress{height:16px;background:#0b140e;border:2px solid #070d09;border-radius:10px;overflow:hidden;margin:0 0 14px}.bar{height:100%;width:0;background:var(--gold);transition:.25s}.feedback{margin-top:12px;padding:10px;border:2px dashed #607255;background:#f6f0c8;display:none}.feedback.show{display:block}.result{font-size:clamp(30px,7vw,60px);text-align:center;margin:20px 0}.stars{font-size:40px;text-align:center}.tiny{font-size:12px;color:#b8ca9d;text-align:center;padding:0 10px 12px}.hidden{display:none!important}
@media(max-width:640px){.top{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1}.screen{padding:10px;min-height:640px}.card{padding:14px}.sizegrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="shell">
<div class="top"><div class="brand">⚡ NETVILA 5 // FAILAI 2.0</div><div class="chip" id="level">Stotelė 1/4</div><div class="chip" id="xp">XP 0</div></div>
<div class="screen"><div class="progress"><div id="bar" class="bar"></div></div><div id="game"></div></div>
<div class="tiny">5 klasė • failų tipai • aplankų struktūra • KB / MB / GB • vietinis ir debesijos saugojimas • ZIP</div>
</div></div>
<script>
const game=document.getElementById('game'),xpEl=document.getElementById('xp'),levelEl=document.getElementById('level'),bar=document.getElementById('bar');
let xp=0,stage=0,q=0,selected=null,sorted=0,sizeOrder=[];
const quickQs=[
 {q:'Kuris failas yra PowerPoint pateiktis?',o:['tyrimas.xlsx','projektas.pptx','nuotrauka.png'],a:1,e:'.pptx – PowerPoint pateiktis.'},
 {q:'Kuris failas greičiausiai yra skaičiuoklė?',o:['duomenys.xlsx','duomenys.pdf','duomenys.jpg'],a:0,e:'.xlsx – Excel skaičiuoklės failas.'},
 {q:'Kuris pavadinimas padės failą rasti ir po kelių mėnesių?',o:['galutinis2.docx','asdf.docx','5A_IT_failu_tyrimas.docx'],a:2,e:'Geras pavadinimas trumpai paaiškina failo turinį.'},
 {q:'Jei pervadinsi „foto.jpg“ į „foto.pdf“, kas nutiks?',o:['Failas tikrai taps PDF','Pasikeis tik pavadinimas – failo turinys nuo to nepasikeis','Failas automatiškai susispaus'],a:1,e:'Vien plėtinio raidžių pakeitimas nepakeičia tikro failo formato.'}
];
const sortFiles=[
 {n:'klases_nuotrauka.jpg',i:'🖼️',t:'Nuotraukos'},
 {n:'projekto_aprasymas.docx',i:'📝',t:'Dokumentai'},
 {n:'eksperimento_duomenys.xlsx',i:'📊',t:'Lentelės'},
 {n:'pristatymas.pptx',i:'📽️',t:'Skaidrės'},
 {n:'projekto_failai.zip',i:'🗜️',t:'Archyvai'}
];
const labQs=[
 {q:'Klasės projektą nori tęsti ir mokykloje, ir namuose. Kur patogiau jį laikyti?',o:['Tik viename mokyklos kompiuteryje','OneDrive debesijoje','Šiukšlinėje'],a:1,e:'Debesijoje saugomą failą gali pasiekti iš skirtingų įrenginių prisijungęs prie paskyros.'},
 {q:'Aplanke yra 18 failų. Nori juos perduoti kaip vieną paketą. Ką prasminga padaryti?',o:['Sukurti ZIP archyvą','Pervadinti visus į „1“','Pakeisti visus į .jpg'],a:0,e:'ZIP leidžia kelis failus ar aplankus supakuoti į vieną archyvą.'},
 {q:'Aplankas prieš glaudinimą buvo 48 MB, o ZIP archyvas – 31 MB. Ką rodo šis bandymas?',o:['Glaudinimas šiuo atveju sumažino dydį','ZIP visada padidina failus','31 MB yra daugiau už 48 MB'],a:0,e:'Šiuo atveju glaudinimas sumažino dydį. Skirtingi failai gali susispausti nevienodai.'}
];
const bossQs=[
 {q:'Kurio failo dydis didžiausias?',o:['užrašai – 85 KB','nuotrauka – 4 MB','vaizdo_irasas – 620 MB'],a:2,e:'620 MB yra daugiau nei 4 MB ir 85 KB.'},
 {q:'Interneto nėra, bet failą reikia atidaryti dabar. Kuris variantas patikimiausias?',o:['Failas saugomas tik debesijoje ir neatsisiųstas','Failo kopija yra šiame kompiuteryje','Turiu tik nuorodos pavadinimą'],a:1,e:'Vietinė kopija kompiuteryje prieinama ir be interneto.'},
 {q:'Turi daug projekto failų. Kokia struktūra logiškiausia?',o:['Visi failai darbalaukyje','Projektai → Gamtos projektas → Dokumentai / Nuotraukos / Duomenys','Aplankas1 → Aplankas2 → Aplankas3'],a:1,e:'Aplankų pavadinimai ir struktūra turi padėti greitai suprasti, kur kas yra.'}
];
function hud(){xpEl.textContent='XP '+xp;bar.style.width=Math.min(100,(stage/4)*100)+'%';levelEl.textContent='Stotelė '+Math.min(stage+1,4)+'/4'}
function addXP(n){xp+=n;hud()}
function splash(){game.innerHTML=`<div class="card"><span class="mission">5 KLASĖ · 1 LYGIS</span><h1>FAILAI 2.0</h1><p>Praktinę dalį jau atlikai. Dabar trumpa NETVILOS patikra: ar tikrai supranti failų tipus, struktūrą, dydžius, debesiją ir ZIP?</p><p><b>Trukmė:</b> apie 8–10 min. • <b>4 stotelės</b></p><div class="actions"><button class="btn" onclick="start()">PRADĖTI ĮTVIRTINIMĄ →</button></div></div>`}
function start(){xp=0;stage=0;q=0;hud();renderQuick()}
function renderQuick(){hud();const x=quickQs[q];game.innerHTML=`<div class="card"><span class="mission">1 STOTELĖ – FAILŲ DETEKTYVAS</span><h2>${x.q}</h2><div class="choices">${x.o.map((o,i)=>`<button class="btn choice" onclick="answerQuick(${i},this)">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div></div>`}
function answerQuick(i,b){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);const x=quickQs[q],fb=document.getElementById('fb');if(i===x.a){b.classList.add('correct');addXP(8);fb.innerHTML='✅ '+x.e}else{b.classList.add('wrong');document.querySelectorAll('.choice')[x.a].classList.add('correct');fb.innerHTML='❌ '+x.e}fb.classList.add('show');setTimeout(()=>{q++;if(q<quickQs.length)renderQuick();else{stage=1;renderSort()}},650)}
function renderSort(){hud();selected=null;sorted=0;game.innerHTML=`<div class="card"><span class="mission">2 STOTELĖ – SUTVARKYK CHAOSĄ</span><h2>Pasirink failą, tada jo aplanką</h2><p class="muted">Čia jau ne spėjimas – pritaikyk tą pačią logiką, kurią naudojai OneDrive.</p><div class="filebox" id="files">${sortFiles.map((f,i)=>`<div class="file" id="f${i}" onclick="pick(${i})"><div class="icon">${f.i}</div>${f.n}</div>`).join('')}</div><div class="folders">${['Dokumentai','Skaidrės','Lentelės','Nuotraukos','Archyvai'].map(n=>`<div class="folder" onclick="dropTo('${n}')">📁 ${n}</div>`).join('')}</div><div id="fb" class="feedback"></div></div>`}
function pick(i){if(document.getElementById('f'+i).classList.contains('hidden'))return;selected=i;document.querySelectorAll('.file').forEach(x=>x.classList.remove('selected'));document.getElementById('f'+i).classList.add('selected')}
function dropTo(folder){const fb=document.getElementById('fb');if(selected===null){fb.textContent='Pirmiausia pasirink failą.';fb.classList.add('show');return}const f=sortFiles[selected];if(f.t===folder){document.getElementById('f'+selected).classList.add('hidden');addXP(8);sorted++;fb.textContent='✅ '+f.n+' → '+folder;selected=null;if(sorted===sortFiles.length)setTimeout(()=>{stage=2;renderSizeOrder()},500)}else{fb.textContent='❌ Kur šio failo ieškotum po savaitės?';}fb.classList.add('show')}
function renderSizeOrder(){hud();sizeOrder=[];const cards=[{v:0,t:'450 KB',n:'tekstas'},{v:1,t:'6 MB',n:'nuotrauka'},{v:2,t:'1,2 GB',n:'vaizdo įrašas'}];game.innerHTML=`<div class="card"><span class="mission">3 STOTELĖ – DYDŽIO LABORATORIJA</span><h2>Sudėk nuo mažiausio iki didžiausio</h2><p>Spustelk failus teisinga tvarka.</p><div class="sizegrid">${cards.map((c,i)=>`<div class="sizecard" id="s${i}" onclick="pickSize(${i},${c.v},'${c.t}')"><b>${c.t}</b><br><span class="muted">${c.n}</span></div>`).join('')}</div><div class="order" id="order">Tavo seka: —</div><div id="fb" class="feedback"></div></div>`}
function pickSize(i,v,label){const el=document.getElementById('s'+i);if(el.classList.contains('used'))return;el.classList.add('used');sizeOrder.push(v);document.getElementById('order').textContent='Tavo seka: '+sizeOrder.map(x=>['450 KB','6 MB','1,2 GB'][x]).join(' → ');if(sizeOrder.length===3){const fb=document.getElementById('fb');if(sizeOrder.join(',')==='0,1,2'){addXP(12);fb.textContent='✅ Teisingai: KB → MB → GB.'}else{fb.textContent='❌ Teisinga kryptis: KB → MB → GB. Mažiausias čia 450 KB, didžiausias – 1,2 GB.'}fb.classList.add('show');setTimeout(()=>{q=0;renderLabQ()},850)}}
function renderLabQ(){const x=labQs[q];game.innerHTML=`<div class="card"><span class="mission">3 STOTELĖ – DYDIS, DEBESIS IR ZIP</span><h2>${x.q}</h2><div class="choices">${x.o.map((o,i)=>`<button class="btn choice" onclick="answerLab(${i},this)">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div></div>`}
function answerLab(i,b){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);const x=labQs[q],fb=document.getElementById('fb');if(i===x.a){b.classList.add('correct');addXP(8);fb.innerHTML='✅ '+x.e}else{b.classList.add('wrong');document.querySelectorAll('.choice')[x.a].classList.add('correct');fb.innerHTML='❌ '+x.e}fb.classList.add('show');setTimeout(()=>{q++;if(q<labQs.length)renderLabQ();else{stage=3;q=0;renderBoss()}},700)}
function renderBoss(){hud();const x=bossQs[q];game.innerHTML=`<div class="card"><span class="mission">4 STOTELĖ – BOSS</span><h2>⚠️ NETVILOS FAILŲ TERMINALAS</h2><p><b>${x.q}</b></p><div class="choices">${x.o.map((o,i)=>`<button class="btn choice" onclick="answerBoss(${i},this)">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div></div>`}
function answerBoss(i,b){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);const x=bossQs[q],fb=document.getElementById('fb');if(i===x.a){b.classList.add('correct');addXP(12);fb.innerHTML='✅ '+x.e}else{b.classList.add('wrong');document.querySelectorAll('.choice')[x.a].classList.add('correct');fb.innerHTML='❌ '+x.e}fb.classList.add('show');setTimeout(()=>{q++;if(q<bossQs.length)renderBoss();else finish()},750)}
function finish(){stage=4;hud();const max=120,p=Math.round(xp/max*100),stars=p>=85?'⭐⭐⭐':p>=60?'⭐⭐':'⭐';game.innerHTML=`<div class="card"><span class="mission">1 LYGIS ĮVEIKTAS</span><div class="result">FAILŲ CHAOSAS SUTVARKYTAS</div><div class="stars">${stars}</div><h2 style="text-align:center">${xp} / ${max} XP • ${p}%</h2><p style="text-align:center">Pasitikrinai failų tipus, aplankų struktūrą, prasmingus pavadinimus, KB / MB / GB, vietinį ir debesijos saugojimą bei ZIP paskirtį.</p><div class="actions" style="justify-content:center"><button class="btn alt" onclick="splash();xp=0;stage=0;q=0;hud()">KARTOTI LYGĮ</button></div></div>`}
splash();hud();
</script>
</body>
</html>
