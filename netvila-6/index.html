<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NETVILA 6 – Kiberagentų incidentas</title>
<style>
:root{--bg:#0d1812;--panel:#edf2bf;--ink:#17231a;--wall:#314836;--path:#b8cf8e;--gold:#ffd94f;--good:#82cc6b;--bad:#ee846f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#294831,#0d1812 55%);color:#eef5d0;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}.wrap{width:min(1020px,100%);padding:10px}.shell{background:#193020;border:4px solid #050a07;border-radius:18px;overflow:hidden;box-shadow:0 20px 70px #0009}.top{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:10px;background:#0a140e;border-bottom:4px solid #050a07;align-items:center}.brand{font-weight:900;font-size:18px}.chip{background:#31543a;border:2px solid #050a07;border-radius:8px;padding:7px 10px;font-weight:900}.game{padding:12px}.barbg{height:15px;background:#071009;border:2px solid #000;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:var(--gold);transition:.5s}.map{margin:12px auto 6px;max-width:780px;display:grid;grid-template-columns:repeat(13,1fr);gap:3px;background:#08100b;border:4px solid #030705;border-radius:10px;padding:5px}.tile{aspect-ratio:1;background:var(--path);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,4vw,35px);position:relative}.wall{background:var(--wall)}.station{background:#e4d979;box-shadow:inset 0 0 0 3px #5f541b}.player{animation:bob .7s infinite alternate;filter:drop-shadow(2px 3px #0005)}@keyframes bob{to{transform:translateY(-4px)}}.controls{display:grid;grid-template-columns:repeat(3,62px);gap:6px;justify-content:center;margin:10px auto}.ctrl{height:52px;border:3px solid #071009;border-radius:9px;background:#e5efad;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 4px #071009}.ctrl:active{transform:translateY(3px);box-shadow:0 1px #071009}.blank{visibility:hidden}.hintline{text-align:center;color:#c2d5ad;font-weight:700}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#020504d9;padding:14px;z-index:20}.modal.show{display:flex}.card{width:min(680px,100%);background:var(--panel);color:var(--ink);border:5px solid #121d15;border-radius:12px;padding:20px;box-shadow:10px 10px #0006}.badge{display:inline-block;background:#2b5036;color:#fff;padding:5px 9px;border:2px solid #121d15;border-radius:5px;font-weight:900}.q{font-size:clamp(20px,4vw,29px);font-weight:900;line-height:1.25;margin:10px 0}.choices{display:grid;gap:9px}.choice,.btn{width:100%;text-align:left;border:3px solid #17231a;border-radius:9px;background:#dce8a5;color:#17231a;padding:12px;font-size:18px;font-weight:900;cursor:pointer}.choice.good{background:var(--good)}.choice.bad{background:var(--bad)}.btn{width:auto;text-align:center}.summary{margin-top:12px;background:#fffbd9;border:3px dashed #607354;border-radius:8px;padding:14px;font-size:18px;line-height:1.35}.reward{text-align:center;font-size:46px;min-height:60px}.flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0}.flash.go{animation:flash .7s ease}@keyframes flash{25%{opacity:.42;background:#fff46d}100%{opacity:0}}.pop{position:fixed;z-index:50;pointer-events:none;font-size:30px;animation:pop 1.35s ease-out forwards}@keyframes pop{0%{transform:scale(.4);opacity:0}20%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}@media(max-width:650px){.top{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1}.map{gap:2px;padding:3px}.controls{grid-template-columns:repeat(3,56px)}}
</style>
</head>
<body>
<div class="wrap"><div class="shell"><div class="top"><div class="brand">🕵️ NETVILA 6 // KIBERAGENTŲ INCIDENTAS</div><div class="chip" id="xp">XP 0</div><div class="chip" id="key">🔐 0/4</div><div class="chip" id="life">❤️❤️❤️</div></div><div class="game"><div class="barbg"><div class="bar" id="bar"></div></div><div id="map" class="map"></div><div class="controls"><button class="ctrl blank" type="button">•</button><button class="ctrl" id="up" type="button">↑</button><button class="ctrl blank" type="button">•</button><button class="ctrl" id="left" type="button">←</button><button class="ctrl" id="interact" type="button">◎</button><button class="ctrl" id="right" type="button">→</button><button class="ctrl blank" type="button">•</button><button class="ctrl" id="down" type="button">↓</button><button class="ctrl blank" type="button">•</button></div><div class="hintline">Valdyk rodyklėmis / WASD • prieik prie geltonos stotelės • spausk ◎ arba Enter</div></div></div></div>
<div class="modal show" id="modal"><div class="card" id="card"></div></div><div class="flash" id="flash"></div>
<script>
'use strict';
const W=13,H=9;
const walls=new Set();
for(let x=0;x<W;x++){walls.add(`${x},0`);walls.add(`${x},${H-1}`)}
for(let y=0;y<H;y++){walls.add(`0,${y}`);walls.add(`${W-1},${y}`)}
['4,2','4,3','4,4','8,4','8,5','2,6','3,6','9,2','10,2'].forEach(v=>walls.add(v));
const stations=[
{id:0,x:2,y:2,icon:'✉️',name:'Laiškų skyrius',q:'Kuris požymis LABIAUSIAI verčia sustoti ir tikrinti?',opts:['Laiške yra mokyklos logotipas','Laiškas skubina ir prašo prisijungti per netikėtą nuorodą','Laiškas trumpas'],ok:1,hint:'Logotipą nukopijuoti lengva. Žiūrėk į prašymą ir skubinimą.',remember:'Netikėtas skubinimas + prisijungimo prašymas = SUSTOK ir tikrink.'},
{id:1,x:6,y:2,icon:'🔗',name:'Nuorodų laboratorija',q:'Prieš įvesdamas slaptažodį, ką tikrini pirmiausia?',opts:['Ar puslapis gražiai atrodo','Adreso juostą ir ar pats atėjau į oficialų puslapį','Ar yra daug mygtukų'],ok:1,hint:'Svarbiausia ne dizainas, o tikras adresas ir kontekstas.',remember:'Ne logotipas, o adreso juosta ir oficialus kelias padeda patikrinti puslapį.'},
{id:2,x:10,y:6,icon:'🚨',name:'Incidento centras',q:'Jau įvedei slaptažodį į įtartiną puslapį. Saugiausias kitas žingsnis?',opts:['Nieko nesakyti ir tikėtis, kad nieko nenutiks','Pranešti suaugusiajam / mokytojui ir keisti slaptažodį per oficialų puslapį','Parašyti tam puslapiui savo telefono numerį'],ok:1,hint:'Po klaidos svarbiausia greitai sumažinti žalą.',remember:'Klaidos neslepiame: PRANEŠK ir APSAUGOK paskyrą.'},
{id:3,x:6,y:6,icon:'🛡️',name:'Apsaugos bokštas',q:'Kas geriausiai sustiprina paskyrą?',opts:['Tas pats slaptažodis visur','Unikalus slaptažodis ir 2FA, kai galima','Trumpas slaptažodis, kad būtų lengva'],ok:1,hint:'Vienas papildomas apsaugos sluoksnis labai padeda.',remember:'Unikalus slaptažodis + 2FA sumažina riziką, jei vienas slaptažodis nutekėtų.'}
];
let px=1,py=1,xp=0,lives=3,locked=true;
const done=new Set();
const mapEl=document.getElementById('map');
const modalEl=document.getElementById('modal');
const cardEl=document.getElementById('card');
const flashEl=document.getElementById('flash');
function draw(){mapEl.innerHTML='';for(let y=0;y<H;y++){for(let x=0;x<W;x++){const tile=document.createElement('div');tile.className='tile'+(walls.has(`${x},${y}`)?' wall':'');const s=stations.find(v=>v.x===x&&v.y===y);if(s){tile.classList.add('station');tile.textContent=done.has(s.id)?'✅':s.icon}if(x===px&&y===py){tile.innerHTML='<span class="player">🕵️</span>'}mapEl.appendChild(tile)}}document.getElementById('xp').textContent=`XP ${xp}`;document.getElementById('key').textContent=`🔐 ${done.size}/4`;document.getElementById('life').textContent='❤️'.repeat(Math.max(0,lives));document.getElementById('bar').style.width=`${done.size/4*100}%`}
function showModal(html){cardEl.innerHTML=html;modalEl.classList.add('show')}
function hideModal(){modalEl.classList.remove('show');locked=false;draw()}
function movePlayer(dx,dy){if(locked||modalEl.classList.contains('show'))return;const nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=W||ny>=H||walls.has(`${nx},${ny}`))return;px=nx;py=ny;draw();const s=stations.find(v=>v.x===px&&v.y===py&&!done.has(v.id));if(s){locked=true;setTimeout(()=>openQuestion(s),350)}}
function interactHere(){if(locked||modalEl.classList.contains('show'))return;const s=stations.find(v=>v.x===px&&v.y===py&&!done.has(v.id));if(s){locked=true;openQuestion(s)}}
function rewardBurst(){for(let i=0;i<9;i++){const e=document.createElement('div');e.className='pop';e.textContent=['⭐','✨','⚡'][Math.floor(Math.random()*3)];e.style.left=`${40+Math.random()*20}%`;e.style.top=`${40+Math.random()*15}%`;e.style.setProperty('--x',`${Math.random()*220-110}px`);e.style.setProperty('--y',`${-60-Math.random()*120}px`);document.body.appendChild(e);setTimeout(()=>e.remove(),1450)}}
function flashReward(){flashEl.classList.remove('go');void flashEl.offsetWidth;flashEl.classList.add('go')}
function openQuestion(s){showModal(`<span class="badge">${s.icon} ${s.name}</span><div class="q">${s.q}</div><div class="choices" id="choices"></div><button class="btn" id="hintBtn" type="button" style="margin-top:12px">💡 Užuomina</button><div id="hintbox"></div>`);const choices=document.getElementById('choices');s.opts.forEach((text,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=text;b.addEventListener('click',()=>answerQuestion(s,i,b));choices.appendChild(b)});document.getElementById('hintBtn').addEventListener('click',()=>{document.getElementById('hintbox').innerHTML=`<div class="summary">${s.hint}</div>`})}
function answerQuestion(s,i,btn){const buttons=[...document.querySelectorAll('.choice')];buttons.forEach(b=>b.disabled=true);if(i===s.ok){btn.classList.add('good');xp+=100;done.add(s.id);draw();flashReward();rewardBurst();setTimeout(()=>{showModal(`<div class="reward">⭐⭐⭐</div><h2>+100 XP • ĮRODYMAS SURASTAS</h2><div class="summary"><b>PRISIMINK:</b><br>${s.remember}</div><button class="btn" id="continueBtn" type="button" style="margin-top:16px">Tęsti misiją</button>`);document.getElementById('continueBtn').addEventListener('click',afterQuestion)},800)}else{btn.classList.add('bad');lives=Math.max(0,lives-1);draw();setTimeout(()=>{buttons.forEach(b=>b.disabled=false);btn.disabled=true;const hb=document.getElementById('hintbox');if(hb)hb.innerHTML=`<div class="summary">Dar kartą. ${s.hint}</div>`},650)}}
function afterQuestion(){if(done.size===4){setTimeout(showBoss,350)}else hideModal()}
function showBoss(){showModal('<span class="badge">🚪 BOSS • INCIDENTO UŽDARYMAS</span><div class="q">Kokia saugiausia reakcijos seka?</div><div class="choices" id="bossChoices"></div>');const opts=[['SPAUSK → SLĖPK → LAUK',false],['SUSTOK → PATIKRINK → PRANEŠK → APSAUGOK PASKYRĄ',true],['ATSAKYK SUKČIUI → PAPRAŠYK PAAIŠKINTI',false]];const box=document.getElementById('bossChoices');opts.forEach(([t,ok])=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=t;b.addEventListener('click',()=>bossAnswer(ok,b));box.appendChild(b)})}
function bossAnswer(ok,btn){const bs=[...document.querySelectorAll('.choice')];bs.forEach(b=>b.disabled=true);if(ok){btn.classList.add('good');xp+=200;draw();flashReward();rewardBurst();setTimeout(()=>{showModal(`<div class="reward">🏆✨🏆</div><h1>MISIJA ĮVYKDYTA!</h1><div class="summary"><b>Tavo kiberagento formulė:</b><br>SUSTOK → PATIKRINK → PRANEŠK → APSAUGOK PASKYRĄ<br><br>XP: ${xp}</div><button class="btn" id="againBtn" type="button" style="margin-top:16px">Žaisti dar kartą</button>`);document.getElementById('againBtn').addEventListener('click',()=>location.reload())},850)}else{btn.classList.add('bad');setTimeout(showBoss,850)}}
document.getElementById('up').addEventListener('click',()=>movePlayer(0,-1));
document.getElementById('down').addEventListener('click',()=>movePlayer(0,1));
document.getElementById('left').addEventListener('click',()=>movePlayer(-1,0));
document.getElementById('right').addEventListener('click',()=>movePlayer(1,0));
document.getElementById('interact').addEventListener('click',interactHere);
document.addEventListener('keydown',e=>{if(modalEl.classList.contains('show'))return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','enter'].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')movePlayer(0,-1);if(k==='arrowdown'||k==='s')movePlayer(0,1);if(k==='arrowleft'||k==='a')movePlayer(-1,0);if(k==='arrowright'||k==='d')movePlayer(1,0);if(k==='enter')interactHere()});
function showIntro(){showModal('<div class="reward">🕵️‍♀️🔐🕵️</div><h1>NETVILA 6</h1><h2>Kiberagentų incidentas</h2><div class="summary">Mokyklos paskyroje aptiktas nežinomas prisijungimas. Apeik 4 tyrimo stoteles, surink įrodymus ir uždaryk incidentą.<br><br><b>Valdymas:</b> rodyklės / WASD arba ekrano mygtukai.</div><button class="btn" id="startBtn" type="button" style="margin-top:16px">PRADĖTI MISIJĄ</button>');document.getElementById('startBtn').addEventListener('click',hideModal)}
draw();showIntro();
</script>
</body></html>
