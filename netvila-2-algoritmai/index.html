<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NETVILA 2 – Robotų miesto misija</title>
<style>
:root{--bg:#102018;--panel:#eef3bf;--ink:#16231a;--dark:#09110c;--mid:#2b5036;--gold:#ffd84e;--good:#86cf70;--bad:#ef846f;--path:#c8d998;--wall:#37513c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#2b5036,#102018 45%,#08100b);color:#f6f8d7}body{display:flex;justify-content:center}.wrap{width:min(980px,100%);padding:10px}.shell{background:#193024;border:4px solid var(--dark);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #0008}.top{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;background:#0d1b13;padding:10px;border-bottom:4px solid var(--dark)}.brand{font-weight:900}.chip{background:#31573b;border:2px solid var(--dark);border-radius:8px;padding:7px 10px;font-weight:800}.game{padding:12px}.progress{height:14px;background:#08100b;border-radius:10px;overflow:hidden;border:2px solid #000;margin-bottom:10px}.bar{height:100%;width:0;background:var(--gold);transition:.4s}.map{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;max-width:770px;margin:auto;background:#0d1a12;padding:6px;border:4px solid #08100b;border-radius:10px}.tile{aspect-ratio:1/1;background:var(--path);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5vw,42px);position:relative}.tile.wall{background:var(--wall)}.tile.station{background:#e7dc78;box-shadow:inset 0 0 0 3px #6d5d1c}.tile.gate{background:#9b8153}.player{filter:drop-shadow(2px 3px 0 #0005);animation:bob .7s infinite alternate}@keyframes bob{to{transform:translateY(-4px)}}.controls{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin:12px auto}.ctrl{height:54px;border:3px solid #071009;border-radius:10px;background:#e4edaa;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #071009}.ctrl:active{transform:translateY(3px);box-shadow:0 1px 0 #071009}.blank{visibility:hidden}.hint{text-align:center;color:#c8d7ae;font-weight:700;font-size:14px}.modal{position:fixed;inset:0;background:#020504cc;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.show{display:flex}.card{width:min(650px,100%);background:var(--panel);color:var(--ink);border:5px solid #142018;border-radius:12px;padding:20px;box-shadow:10px 10px 0 #0006}.badge{display:inline-block;background:#2d5238;color:white;border:2px solid #132018;padding:5px 9px;border-radius:5px;font-weight:900;margin-bottom:8px}.card h1,.card h2{margin:4px 0 10px}.q{font-size:clamp(20px,4vw,28px);font-weight:900;line-height:1.3}.choices{display:grid;gap:9px;margin-top:14px}.choice,.btn{border:3px solid #152119;border-radius:9px;background:#dce8a2;color:#17231a;padding:12px;font-size:18px;font-weight:900;cursor:pointer}.choice:hover,.btn:hover{filter:brightness(1.03)}.choice.good{background:var(--good)}.choice.bad{background:var(--bad)}.summary{background:#fffbd8;border:3px dashed #657350;padding:14px;border-radius:8px;margin-top:12px;font-size:18px}.big{font-size:54px;text-align:center}.stars{font-size:36px;text-align:center;letter-spacing:6px;min-height:50px}.flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:40}.flash.go{animation:flash .7s ease}@keyframes flash{20%{opacity:.45;background:#fff76c}100%{opacity:0}}.pop{position:fixed;pointer-events:none;z-index:50;font-size:26px;animation:pop 1.4s ease-out forwards}@keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.3);opacity:0}}@media(max-width:650px){.top{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1}.map{gap:2px;padding:3px}.controls{grid-template-columns:repeat(3,58px)}}
</style></head>
<body><div class="wrap"><div class="shell">
<div class="top"><div class="brand">🤖 NETVILA 2 // ROBOTŲ MIESTAS</div><div class="chip" id="crystalHud">💎 0/3</div><div class="chip" id="xpHud">⭐ 0 XP</div><div class="chip" id="missionHud">Misija 1</div></div>
<div class="game"><div class="progress"><div class="bar" id="bar"></div></div><div class="map" id="map"></div><div class="controls"><button class="ctrl blank">•</button><button class="ctrl" data-d="up">⬆️</button><button class="ctrl blank">•</button><button class="ctrl" data-d="left">⬅️</button><button class="ctrl" data-d="down">⬇️</button><button class="ctrl" data-d="right">➡️</button></div><div class="hint">Judėk rodyklėmis klaviatūroje arba spausk dideles rodykles pele. Eik prie mirksinčių vietų ✨</div></div>
</div></div><div class="modal show" id="modal"><div class="card" id="card"></div></div><div class="flash" id="flash"></div>
<script>
const COLS=11,ROWS=7;
const walls=new Set(['4,0','4,1','4,2','6,2','7,2','2,4','3,4','7,4','8,4','4,6']);
const stations={
 '2,1':{id:'command',icon:'🎮',title:'Tikslių komandų stotis',q:'Robotas turi paeiti 1 langelį į dešinę. Kuri komanda tinka?',opts:['➡️ Į dešinę','⬅️ Į kairę','⬆️ Į viršų'],ok:0,summary:'KOMANDA = tikslus nurodymas. Kompiuteris nespėlioja – jis daro tai, ką jam pasakome.'},
 '8,1':{id:'sequence',icon:'🧩',title:'Sekos dirbtuvės',q:'Kuri seka yra algoritmas, kuris nuveda robotą 2 žingsnius į dešinę ir 1 į viršų?',opts:['➡️ ➡️ ⬆️','⬆️ ⬆️ ⬅️','➡️ ⬇️ ⬇️'],ok:0,summary:'ALGORITMAS = komandų seka. Pakeitus komandų tvarką, gali pasikeisti rezultatas.'},
 '3,5':{id:'if',icon:'🚦',title:'JEI–TAI sankryža',q:'JEI prieš robotą yra siena, TAI ką saugiausia daryti?',opts:['🛑 Sustoti ir pasirinkti kitą kryptį','💥 Eiti kiaurai sieną','🙈 Užsimerkti ir eiti'],ok:0,summary:'JEI–TAI padeda priimti sprendimą: JEI įvyksta sąlyga, TAI atliekame sutartą veiksmą.'}
};
const gate={x:9,y:5};let p={x:1,y:3};let done=new Set(),xp=0,crystals=0,locked=false;
const map=document.getElementById('map'),modal=document.getElementById('modal'),card=document.getElementById('card'),bar=document.getElementById('bar');
function key(x,y){return x+','+y}function render(){map.innerHTML='';for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const d=document.createElement('div');d.className='tile';const k=key(x,y);if(walls.has(k)){d.classList.add('wall');d.textContent='🌲'}else if(stations[k]){d.classList.add('station');d.textContent=done.has(stations[k].id)?'✅':stations[k].icon+'✨'}else if(x===gate.x&&y===gate.y){d.classList.add('gate');d.textContent=crystals===3?'🚪✨':'🔒'}if(x===p.x&&y===p.y){d.innerHTML='<span class="player">🤖</span>'}map.appendChild(d)}document.getElementById('crystalHud').textContent='💎 '+crystals+'/3';document.getElementById('xpHud').textContent='⭐ '+xp+' XP';document.getElementById('missionHud').textContent=crystals<3?'Misija '+(crystals+1):'BOSS';bar.style.width=(crystals/3*75)+'%'}
function burst(){document.getElementById('flash').classList.remove('go');void document.getElementById('flash').offsetWidth;document.getElementById('flash').classList.add('go');for(let i=0;i<18;i++){let s=document.createElement('div');s.className='pop';s.textContent=['⭐','✨','💛','🎉'][i%4];s.style.left=(45+Math.random()*10)+'vw';s.style.top=(45+Math.random()*10)+'vh';s.style.setProperty('--x',(Math.random()*420-210)+'px');s.style.setProperty('--y',(Math.random()*360-180)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}
function show(html){card.innerHTML=html;modal.classList.add('show')}function hide(){modal.classList.remove('show');locked=false}
function intro(){show('<div class="big">🤖💎</div><h1>Robotų miesto gelbėjimo misija</h1><p class="q">Surink 3 energijos kristalus. Kiekvieną gausi išsprendęs trumpą komandų užduotį.</p><div class="summary">Valdymas: ⬅️⬆️⬇️➡️ klaviatūra arba rodyklių mygtukai pele.</div><button class="btn" onclick="hide()">PRADĖTI MISIJĄ ▶</button>')}
function challenge(st){locked=true;let opts=st.opts.map((o,i)=>'<button class="choice" onclick="answer(\''+st.id+'\','+i+',this)">'+o+'</button>').join('');show('<span class="badge">✨ '+st.title+'</span><div class="q">'+st.q+'</div><div class="choices">'+opts+'</div>')}
function answer(id,i,el){const st=Object.values(stations).find(s=>s.id===id);document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(i===st.ok){el.classList.add('good');done.add(id);crystals++;xp+=100;burst();setTimeout(()=>{show('<div class="stars">⭐ ⭐ ⭐</div><h2>KRISTALAS GAUTAS! 💎</h2><div class="summary"><b>PRISIMINK:</b><br>'+st.summary+'</div><p>Gavai +100 XP. Kai būsi pasiruošęs, tęsk kelionę.</p><button class="btn" onclick="hide();render()">TĘSTI ▶</button>')},1100)}else{el.classList.add('bad');xp=Math.max(0,xp-10);setTimeout(()=>{show('<div class="big">🔧</div><h2>Dar kartą!</h2><div class="summary">Robotas vykdo tik tikslias komandas. Pagalvok, ką jis padarytų iš tikrųjų.</div><button class="btn" onclick="hide()">GRĮŽTI IR BANDYTI DAR KARTĄ</button>')},900)}}
function boss(){locked=true;show('<span class="badge">🚪 FINALINIS BOSS</span><div class="big">🤖 🔑 🚪</div><div class="q">Durys atsidaro tik tada, kai robotas turi raktą IR stovi prie durų. Ką reiškia „IR“?</div><div class="choices"><button class="choice" onclick="bossAnswer(0,this)">Turi įvykti ABI sąlygos</button><button class="choice" onclick="bossAnswer(1,this)">Užtenka bet kurios vienos sąlygos</button><button class="choice" onclick="bossAnswer(2,this)">Nereikia jokios sąlygos</button></div>')}
function bossAnswer(i,el){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(i===0){el.classList.add('good');xp+=200;burst();bar.style.width='100%';setTimeout(()=>show('<div class="big">🏆🤖🏆</div><h1>ROBOTŲ MIESTAS IŠGELBĖTAS!</h1><div class="stars">⭐ ⭐ ⭐ ⭐ ⭐</div><div class="summary"><b>ŠIANDIEN IŠMOKAI:</b><br>🎮 Komanda turi būti tiksli.<br>🧩 Algoritmas yra komandų seka.<br>🚦 JEI–TAI padeda pasirinkti veiksmą.<br>🔗 IR reiškia, kad turi galioti abi sąlygos.</div><p><b>Galutinis rezultatas: '+xp+' XP</b></p><button class="btn" onclick="location.reload()">ŽAISTI DAR KARTĄ ↻</button>'),1200)}else{el.classList.add('bad');setTimeout(()=>show('<h2>Boss dar laukia 🙂</h2><div class="summary">„IR“ reiškia, kad reikia vienos sąlygos <b>IR</b> kitos sąlygos – abiejų kartu.</div><button class="btn" onclick="boss()">BANDYTI DAR KARTĄ</button>'),900)}}
function move(dx,dy){if(locked)return;let nx=p.x+dx,ny=p.y+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS||walls.has(key(nx,ny)))return;p.x=nx;p.y=ny;render();let k=key(nx,ny);if(stations[k]&&!done.has(stations[k].id))setTimeout(()=>challenge(stations[k]),350);if(nx===gate.x&&ny===gate.y){if(crystals===3)setTimeout(boss,350);else{locked=true;show('<div class="big">🔒</div><h2>Durys dar užrakintos</h2><div class="summary">Pirmiausia surink visus 3 💎 kristalus.</div><button class="btn" onclick="hide()">GERAI</button>')}}}
document.querySelectorAll('.ctrl[data-d]').forEach(b=>b.onclick=()=>({up:()=>move(0,-1),down:()=>move(0,1),left:()=>move(-1,0),right:()=>move(1,0)})[b.dataset.d]());document.addEventListener('keydown',e=>{const f={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(f[e.key]){e.preventDefault();move(...f[e.key])}});render();intro();
</script></body></html>
